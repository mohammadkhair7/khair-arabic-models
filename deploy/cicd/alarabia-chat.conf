# CI/CD config — alarabia.chat. Sourced by deploy.sh on the host.
#
# Contains nothing server-specific: every path derives from ALARABIA_ROOT, which
# deploy.sh reads from host.env. Moving to the planned Server "QC" therefore
# needs no change here — run the same deploy, copy the OKMS object, change DNS.
# See docs/ALARABIA_CHAT_OVH_MIGRATION_PLAN.md.
APP_NAME=alarabia-chat
OKMS_PATH=alarabia-chat/deploy
BRANCH=main
COMPOSE_DIR=deploy
COMPOSE_FILES="-f docker-compose.yml"

ALARABIA_ROOT="${ALARABIA_ROOT:-/opt/alarabia}"
SRC_DIR="$ALARABIA_ROOT/src"

# Source access uses a read-only GitHub DEPLOY KEY rather than a personal access
# token: it is scoped to this one repository, cannot write, and never expires,
# so no long-lived account credential has to live in OKMS. The private key is
# root-only on the host; the public half is registered on the repo.
REPO_SSH=git@github.com:qurancomp/khair-arabic-models.git
DEPLOY_KEY="$ALARABIA_ROOT/.ssh/id_ed25519_ghdeploy"
GIT_KNOWN_HOSTS="$ALARABIA_ROOT/.ssh/known_hosts"

# Which LFS objects the server actually needs. The repo tracks *.pt and *.jsonl;
# only the four checkpoints (62 MB) go into the image, while data/*.jsonl is
# 156 MB of training corpus that inference never touches.
LFS_INCLUDE="models/**"

# Containers deploy.sh health-gates after `up -d`.
HEALTH_CONTAINERS="alarabia-app alarabia-clamav"
# ...of which these may be late without failing the deploy. A cold ClamAV
# signature database is a multi-minute download from a rate-limited mirror; the
# site serves pasted text the whole time and only uploads are refused.
HEALTH_SOFT="alarabia-clamav"

# Per-container readiness probe, run inside the container. The app image is a
# slim python base with no curl in it, so the probe is the same stdlib call the
# Dockerfile's own HEALTHCHECK makes.
health_cmd_for() {
  case "$1" in
    alarabia-app)    echo "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()\"" ;;
    alarabia-clamav) echo "clamdcheck.sh" ;;
    *)               echo "" ;;
  esac
}

# The app preloads all four checkpoints at startup (ARABICWEB_PRELOAD=1), which
# is seconds, not minutes — there is no volume to seed and nothing to derive.
# ClamAV gets a long budget only so a cold database has a fair chance before the
# deploy reports it as late.
health_timeout_for() {
  case "$1" in
    alarabia-app)    echo 300 ;;
    alarabia-clamav) echo 600 ;;
    *)               echo 300 ;;
  esac
}

# Static edge upstream: this app is not blue/green, so the snippet is written
# once and never repointed. Seeded here so a fresh server serves correctly.
#
# flush_interval -1 disables response buffering. There is no SSE here, but the
# download endpoints stream a generated PDF or CSV straight out of memory, and
# buffering them would hold the whole file at the edge for no benefit.
render_caddy_snippets() {
  {
    printf 'reverse_proxy alarabia-app:8000 {\n\tflush_interval -1\n}\n'
  } > "$SNIPPET_DIR/alarabia.caddy"
}
